[project]
name = "agentic-travel-planner"
version = "0.1.0"
description = "A LangGraph multi-agent travel planning capstone with HITL, MCP, memory, and selective replanning."
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

